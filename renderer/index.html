<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' gmapp:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' gmapp: data:;">
  <title>Masks GM</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <aside id="clockbar">
      <div class="brand">
        <div class="brand-title" id="brand-title">MASKS</div>
        <div class="brand-sub" id="brand-sub">Call of Cthulhu · 1925</div>
      </div>

      <div class="clock">
        <div class="clock-date" id="clock-date">—</div>
        <div class="clock-doom" id="clock-doom"></div>
        <input type="range" id="clock-slider" min="0" max="367" value="2">
        <div class="clock-nudge">
          <button id="clock-prev" title="Back one day">&#9664;</button>
          <button id="clock-today" title="Jump to latest session">Now</button>
          <button id="clock-next" title="Forward one day">&#9654;</button>
        </div>
      </div>

      <div class="lane-head">Events on this date</div>
      <div id="clock-events" class="lane-list"></div>

      <div class="lane-head">Legend</div>
      <div id="clock-legend" class="legend"></div>
    </aside>

    <main id="stage">
      <div id="stage-bar">
        <div id="breadcrumb"></div>
        <div id="stage-tools"></div>
      </div>
      <div id="stage-body">
        <div id="map-wrap">
          <div id="map-container">
            <img id="map-img" alt="" draggable="false">
            <div id="hotspot-layer"></div>
            <div id="blip-layer"></div>
          </div>
        </div>
        <div id="content-view" class="hidden"></div>
      </div>
    </main>

    <aside id="railbar">
      <div class="rail-tabs">
        <button class="rail-tab active" data-rail="places">Places</button>
        <button class="rail-tab" data-rail="people">People</button>
        <button class="rail-tab" data-rail="notes">Notes</button>
      </div>
      <div id="rail-body"></div>
    </aside>

    <div id="panel" class="panel hidden">
      <div class="panel-head">
        <span id="panel-title"></span>
        <div class="panel-actions">
          <button id="panel-pdf" title="Open the PDF at this page">PDF</button>
          <button id="panel-close" title="Close">&#10005;</button>
        </div>
      </div>
      <div id="panel-body"></div>
    </div>

  </div>

  <div id="modal-overlay" class="hidden">
    <div id="modal-box">
      <div id="modal-header"></div>
      <div id="modal-body"></div>
      <div id="modal-footer"></div>
    </div>
  </div>

  <div id="toast" class="hidden"></div>

  <script src="app.js"></script>
</body>
</html>
